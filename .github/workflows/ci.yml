name: J.A.R.V.I.S. CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static Syntax Compilation Check
        run: |
          python -m py_compile server.py servidor/*.py perfil_maquina.py live_protocolo.py gemini_bridge.py preferences_manager.py transcricao.py provider_router.py system_tools.py plugin_manager.py plugin_sdk.py policy_engine.py controller_engine.py jarvis_mcp_server.py mcp_client_manager.py monitoring/test_suite.py monitoring/test_live_protocolo.py monitoring/test_mcp_client.py monitoring/test_trust_gates.py monitoring/test_perfil_maquina.py monitoring/test_skills_mcp_ide.py monitoring/conftest.py app.py agentes/assistente.py agentes/contexto.py agentes/roteador.py agentes/ferramentas.py agentes/memoria.py adk_skill_loader.py agentes/computer_use/agente.py agentes/computer_use/playwright_computer.py

      - name: Runtime Module Import Check (Smoke Test)
        run: |
          python -c "import server; import servidor.live_nativo; import servidor.live_adk; import perfil_maquina; import live_protocolo; import provider_router; import policy_engine; import system_tools; import mcp_client_manager; import agentes.memoria; import adk_skill_loader; import agentes.computer_use.agente; from agentes.computer_use.playwright_computer import PlaywrightComputer; print('Todos os modulos importados com sucesso em runtime!')"

      - name: Guard - Toda funcao test_* deve estar no runner explicito das suites por script
        env:
          GEMINI_API_KEY: "ci-dummy-key-test"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          PYTHONPATH=. python - <<'PY'
          import inspect
          from collections import defaultdict
          import monitoring.test_suite as ts
          import monitoring.test_adk as ta

          PARES = [
              ("monitoring.test_suite", ts, (ts.main, ts.run_p0_suite)),
              ("monitoring.test_adk", ta, (ta.executar_todos_testes_adk,)),
          ]
          falhas = []
          for rotulo, modulo, runners in PARES:
              fonte_runners = "\n".join(inspect.getsource(r) for r in runners)
              nomes_por_funcao = defaultdict(set)
              for nome in dir(modulo):
                  if nome.startswith("test_"):
                      obj = getattr(modulo, nome, None)
                      if callable(obj):
                          nomes_por_funcao[id(obj)].add(nome)
              for nomes in nomes_por_funcao.values():
                  # Alias (ex.: test_game_timer_expiration = test_game_companion_timer)
                  # valem se qualquer um dos nomes da função aparece no runner.
                  if not any(n in fonte_runners for n in nomes):
                      falhas.append(f"{rotulo}.{sorted(nomes)}")
          if falhas:
              raise SystemExit("Funcoes test_* fora da lista de execucao explicita: " + ", ".join(falhas))
          print("OK: todas as funcoes test_* estao listadas nos runners manuais")
          PY

      - name: Run R1 Trust Gates Suite
        env:
          GEMINI_API_KEY: "ci-dummy-key-test"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          PYTHONPATH=. pytest monitoring/test_trust_gates.py -v

      - name: Run MCP Client Integration Tests
        env:
          GEMINI_API_KEY: "ci-dummy-key-test"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          PYTHONPATH=. pytest monitoring/test_mcp_client.py -v

      - name: Run Live Protocol Unit Tests
        env:
          GEMINI_API_KEY: "ci-dummy-key-test"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          PYTHONPATH=. pytest monitoring/test_live_protocolo.py -v

      - name: Run Machine Detection Tests (hardware simulado)
        env:
          GEMINI_API_KEY: "ci-dummy-key-test"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          PYTHONPATH=. pytest monitoring/test_perfil_maquina.py -v

      - name: Run Skills, MCP and IDE Mode Regressions
        env:
          GEMINI_API_KEY: "ci-dummy-key-test"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          PYTHONPATH=. pytest monitoring/test_skills_mcp_ide.py -v

      - name: Run P0 Reproduction Regressions
        env:
          GEMINI_API_KEY: "ci-dummy-key-test"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          PYTHONPATH=. pytest monitoring/test_reproduction_p0.py -v

      - name: Run Architecture & Security Test Suite (P0)
        env:
          GEMINI_API_KEY: "ci-dummy-key-test"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          python monitoring/test_suite.py --p0

      - name: Run Google ADK Test Suite
        env:
          GEMINI_API_KEY: "ci-dummy-key-test"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          python monitoring/test_adk.py

      - name: Run Gitleaks Secret Detector
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact --verbose --source .
