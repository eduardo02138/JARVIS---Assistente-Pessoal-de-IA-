name: J.A.R.V.I.S. CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Syntax Compilation Check
        run: |
          python -m py_compile server.py system_tools.py plugin_manager.py plugin_sdk.py policy_engine.py app.py

      - name: Run Architecture & Security Test Suite
        env:
          GEMINI_API_KEY: "AIzaDummyKeyForCIValidation1234567890"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          python monitoring/test_suite.py --p0
