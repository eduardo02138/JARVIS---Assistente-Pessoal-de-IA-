name: J.A.R.V.I.S. CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Syntax Compilation Check
        run: |
          python -m py_compile server.py provider_router.py system_tools.py plugin_manager.py plugin_sdk.py policy_engine.py controller_engine.py jarvis_mcp_server.py monitoring/test_suite.py app.py servidor_adk.py agentes/assistente.py agentes/roteador.py agentes/ferramentas.py agentes/memoria.py adk_skill_loader.py agentes/computer_use/agente.py agentes/computer_use/playwright_computer.py

      - name: Runtime Module Import Check (Smoke Test)
        run: |
          python -c "import servidor_adk; import server; import provider_router; import policy_engine; import system_tools; import agentes.memoria; import adk_skill_loader; import agentes.computer_use.agente; from agentes.computer_use.playwright_computer import PlaywrightComputer; print('Todos os modulos importados com sucesso em runtime!')"

      - name: Run Architecture & Security Test Suite
        env:
          GEMINI_API_KEY: "AIzaDummyKeyForCIValidation1234567890"
          JARVIS_TOKEN: "ci-secret-token-test-123"
        run: |
          python monitoring/test_suite.py --p0

      - name: Run Gitleaks Secret Detector
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact --verbose --source .
